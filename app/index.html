<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TizenHome</title><style>
body{background:#111a28;color:#eef3fa;font:26px Arial,sans-serif;margin:5%;}h1{font-size:54px;margin:0}p{color:#b7c7d9}section{background:#202d40;padding:30px;border-radius:20px;max-width:1000px}input,button{font:inherit;padding:15px;margin:10px;border:3px solid transparent;border-radius:10px;color:white;background:#34465d}input{width:350px}button:focus,input:focus{outline:0;border-color:#71d9ff}button{background:#245b88}pre{white-space:pre-wrap;color:#a9e7ff}small{color:#b7c7d9}
</style></head><body><h1>TizenHome</h1><p>0.2.0 · Диагностика подключения Happ</p><section><label>IP телефона <input id="host" placeholder="192.168.x.x"></label><br><label>HTTP-порт <input id="port" value="10809" type="text"></label><br><button id="test">Проверить прокси</button><button id="health">Проверить службу</button><br><button id="youtube">Доступ к YouTube</button><button id="media">Тест загрузки видео</button><pre id="result">Введите IP телефона.</pre></section><p><small>Тесты идут через HTTP-прокси. Тест видео использует образец MP4 из Google Cloud Storage, а не YouTube CDN. Системный VPN не включается.</small></p><script>
(function(){var ids=['host','port','test','health','youtube','media'],nodes=ids.map(function(id){return document.getElementById(id);}),r=document.getElementById('result');try{nodes[0].value=localStorage.getItem('th-host')||'';nodes[1].value=localStorage.getItem('th-port')||'10809';}catch(e){}
function call(path){r.textContent='Проверяем…';var x=new XMLHttpRequest();x.open('GET','http://127.0.0.1:8094'+path,true);x.timeout=20000;x.onload=function(){try{var d=JSON.parse(x.responseText);r.textContent=d.error?'Ошибка: '+d.error:d.ip?'Прокси работает. Внешний IP: '+d.ip:d.ok?'Служба запущена':d.status?'HTTP '+d.status+' · '+d.bytes+' байт · '+d.ms+' мс\nТип: '+d.type+(d.range?' · Range подтверждён':''):'Неизвестный ответ';}catch(e){r.textContent='Ошибка HTTP '+x.status;}};x.onerror=function(){r.textContent='Служба недоступна';};x.ontimeout=function(){r.textContent='Превышено время ожидания';};x.send();}
nodes[2].onclick=function(){try{localStorage.setItem('th-host',nodes[0].value);localStorage.setItem('th-port',nodes[1].value);}catch(e){}call('/test?host='+encodeURIComponent(nodes[0].value.trim())+'&port='+encodeURIComponent(nodes[1].value.trim()));};nodes[3].onclick=function(){call('/health');};function extra(path){try{localStorage.setItem('th-host',nodes[0].value);localStorage.setItem('th-port',nodes[1].value);}catch(e){}call(path+'?host='+encodeURIComponent(nodes[0].value.trim())+'&port='+encodeURIComponent(nodes[1].value.trim()));}nodes[4].onclick=function(){extra('/youtube');};nodes[5].onclick=function(){extra('/media');};
document.addEventListener('keydown',function(e){var k=e.keyCode,i=nodes.indexOf(document.activeElement);if(k===38||k===40||((k===37||k===39)&&i>=2)){e.preventDefault();nodes[(Math.max(0,i)+(k===38||k===37?nodes.length-1:1))%nodes.length].focus();}});nodes[0].focus();})();
</script></body></html>
