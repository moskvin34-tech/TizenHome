<!doctype html><html lang="ru"><meta charset="utf-8"><title>TizenHome Update</title><style>body{background:#101b2b;color:white;font:28px Arial;margin:6%}button,input{font:inherit;padding:18px;margin:12px;border:3px solid transparent;border-radius:12px;background:#294b70;color:white}button:focus,input:focus{border-color:#a5eeff;outline:none}pre{white-space:pre-wrap;font:22px Arial}</style><h1>TizenHome Update</h1><p>Обновление без ввода длинного адреса</p><button id="go">Проверить и открыть обновление</button><label>Номер версии <input id="ver" value="10" size="4" inputmode="numeric"></label><button id="manual">Открыть по номеру</button><pre id="out">Нажмите OK.</pre><script>
(function(){var go=document.getElementById('go'),v=document.getElementById('ver'),m=document.getElementById('manual'),out=document.getElementById('out'),busy=false;function say(t){out.textContent=t;}function launch(n){if(busy)return;if(!/^[1-9][0-9]{0,3}$/.test(n)){say('Некорректный номер');return;}busy=true;var wanted='gh/moskvin34-tech/TizenHome@'+n,ws,added=false,done=false,timer;function stop(t){if(done)return;done=true;busy=false;clearTimeout(timer);say(t);if(ws)ws.close();}function send(type,payload){ws.send(JSON.stringify({type:type,payload:payload}));}try{ws=new WebSocket('ws://127.0.0.1:8081');}catch(e){stop(e.message);return;}timer=setTimeout(function(){stop('TizenBrew не подтвердил загрузку модуля.');},45000);ws.onopen=function(){say('Проверяем список модулей…');send(4,true);};ws.onerror=function(){stop('Служба TizenBrew недоступна');};ws.onclose=function(){if(!done)stop('Соединение закрыто');};ws.onmessage=function(e){try{var d=JSON.parse(e.data);if(d.type!==4||!Array.isArray(d.payload))return;var found=d.payload.filter(function(x){return x.fullName===wanted;})[0];if(found&&found.version&&found.appPath&&found.packageType==='app'){var a=document.createElement('a');a.href=found.appPath;if(a.hostname!=='127.0.0.1'&&a.hostname!=='localhost'){stop('Неожиданный адрес модуля');return;}send(5,found);done=true;busy=false;clearTimeout(timer);say('Открываем '+found.version);setTimeout(function(){location.href=found.appPath;},300);return;}if(!added){added=true;say('Добавляем @'+n+'…');send(10,{action:'add',module:wanted});setTimeout(function(){if(!done)send(4,true);},1800);}else{stop('Модуль не найден или не загрузился');}}catch(err){stop(err.message);}};}
go.onclick=function(){if(busy)return;busy=true;say('Проверяем опубликованную версию…');var x=new XMLHttpRequest();x.open('GET','https://raw.githubusercontent.com/moskvin34-tech/TizenHome/main/latest.json?t='+Date.now(),true);x.timeout=10000;x.onload=function(){busy=false;try{var d=JSON.parse(x.responseText);if(x.status!==200||!Number.isInteger(d.release))throw Error();v.value=String(d.release);launch(v.value);}catch(e){say('Не удалось проверить обновление. Введите только номер версии.');}};x.onerror=x.ontimeout=function(){busy=false;say('GitHub недоступен. Введите только номер версии.');};x.send();};m.onclick=function(){launch(v.value.trim());};var elements=[go,v,m];document.addEventListener('keydown',function(e){var i=elements.indexOf(document.activeElement);if(e.keyCode===38||e.keyCode===40||(document.activeElement!==v&&(e.keyCode===37||e.keyCode===39))){e.preventDefault();elements[(Math.max(0,i)+(e.keyCode===38||e.keyCode===37?2:1))%3].focus();}});go.focus();})();
</script></html>
