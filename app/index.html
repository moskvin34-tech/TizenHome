<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>TizenHome</title><style>body{margin:3%;background:#111a28;color:#eef3fa;font:24px Arial,sans-serif}h1{margin:0;font-size:48px}section{padding:22px;background:#202d40;border-radius:18px}button,input{font:20px Arial,sans-serif;color:white;background:#34465d;border:3px solid transparent;border-radius:9px;padding:12px;margin:7px}button{background:#245b88}button:focus,input:focus{outline:none;border-color:#71d9ff}input{width:260px}pre{max-height:180px;overflow:auto;white-space:pre-wrap;font-size:21px;color:#a9e7ff}video{max-width:45%;max-height:240px}small{color:#b7c7d9}</style></head><body><h1>TizenHome</h1><p>0.7.0 · Сетевая диагностика</p><section><label>IP телефона <input id="host" placeholder="192.168.x.x"></label><button id="proto">HTTP</button><label>Порт <input id="port" value="10809" style="width:100px"></label><br><button id="test">Проверить прокси</button><button id="youtube">YouTube</button><button id="media">Тест MP4</button><button id="play">Воспроизвести MP4</button><button id="stream">Поток MP4</button><button id="ytbody">YouTube HTML</button><button id="logs">Журнал</button><button id="health">Служба</button><br><button id="ytlaunch">Проверить YouTube</button><img id="thumb" style="display:none;width:240px;vertical-align:middle;margin:8px"><pre id="result">Выберите тест.</pre><video id="video" style="display:none" controls></video></section><p><small>Тестовый ролик MDN, не YouTube. Системный VPN не включается.</small></p><script>
(function(){var ids=['host','proto','port','test','youtube','media','play','stream','ytbody','logs','health','ytlaunch'],n=ids.map(function(i){return document.getElementById(i);}),r=document.getElementById('result'),v=document.getElementById('video'),proto='http',active=0;
try{n[0].value=localStorage.getItem('th-host')||'';proto=localStorage.getItem('th-proto')||'http';n[2].value=localStorage.getItem('th-port')||(proto==='socks'?'10808':'10809');}catch(e){}
function label(){n[1].textContent=proto==='socks'?'SOCKS5':'HTTP';}label();
function save(){try{localStorage.setItem('th-host',n[0].value);localStorage.setItem('th-port',n[2].value);localStorage.setItem('th-proto',proto);}catch(e){}}
n[1].onclick=function(){proto=proto==='http'?'socks':'http';n[2].value=proto==='socks'?'10808':'10809';label();save();};
function addr(path){save();return 'http://127.0.0.1:8099'+path+'?host='+encodeURIComponent(n[0].value.trim())+'&port='+encodeURIComponent(n[2].value.trim())+'&proto='+proto;}
function call(path,play){var seq=++active;v.pause();v._stream=false;v.style.display='none';r.textContent='Проверяем…';var x=new XMLHttpRequest();x.open('GET',addr(path),true);x.timeout=35000;if(play)x.responseType='blob';
x.onload=function(){if(seq!==active)return;if(play&&x.status===200&&/^video\/mp4/i.test(x.getResponseHeader('Content-Type')||'')){if(v._url)URL.revokeObjectURL(v._url);v._url=URL.createObjectURL(x.response);v.src=v._url;v.style.display='block';r.textContent='MP4 загружен. Запускаем плеер.';try{v.play();}catch(e){}return;}
function report(t){try{var d=JSON.parse(t);r.textContent=(d.logs?d.logs.join('\n'):d.error?'Ошибка: '+d.error+' / '+(d.stage||''):d.ip?'Внешний IP: '+d.ip:d.ok?'Служба '+d.version+' работает':d.status?'HTTP '+d.status+' · '+d.bytes+' байт · '+d.ms+' мс · '+d.type:'Неизвестный ответ')+(d.page?'\nTitle: '+d.page:'')+(d.trace?'\n'+d.trace.join(' → '):'');}catch(e){r.textContent='Ошибка HTTP '+x.status;}}
if(play){var reader=new FileReader();reader.onload=function(){if(seq===active)report(reader.result);};reader.readAsText(x.response);}else report(x.responseText);};
x.onerror=function(){if(seq===active)r.textContent='Служба недоступна';};x.ontimeout=function(){if(seq===active)r.textContent='Истекло время ожидания';};x.send();}
n[3].onclick=function(){call('/test');};n[4].onclick=function(){call('/youtube');};n[5].onclick=function(){call('/media');};n[6].onclick=function(){call('/play',true);};n[7].onclick=function(){var seq=++active;v.pause();v._stream=true;v.removeAttribute('crossorigin');v.style.display='none';r.textContent='Получаем разрешение на поток…';var x=new XMLHttpRequest();x.open('GET',addr('/ticket'),true);x.timeout=8000;x.onload=function(){if(seq!==active)return;try{var d=JSON.parse(x.responseText);if(!d.ticket)throw Error(d.error||'No ticket');v.src='http://127.0.0.1:8099/stream?ticket='+encodeURIComponent(d.ticket);v.style.display='block';r.textContent='Открываем поток MP4…';var p=v.play();if(p&&p.catch)p.catch(function(e){if(seq===active)r.textContent='Play: '+e.message;});}catch(e){r.textContent='Ошибка: '+e.message;}};x.onerror=x.ontimeout=function(){if(seq===active)r.textContent='Служба недоступна';};x.send();};n[8].onclick=function(){call('/ytbody');};n[9].onclick=function(){var x=new XMLHttpRequest();x.open('GET',addr('/logs'),true);x.onload=function(){try{r.textContent=JSON.parse(x.responseText).logs.join('\n')||'Журнал пуст';}catch(e){r.textContent='Ошибка журнала';}};x.send();};n[10].onclick=function(){call('/health');};
v.onerror=function(){r.textContent='Ошибка видео: '+(v.error?v.error.code:'?')+' · networkState '+v.networkState+' · readyState '+v.readyState+'. Нажмите Журнал.';};v.onplaying=function(){r.textContent=v._stream?'Поток MP4 воспроизводится через локальную службу.':'MP4 воспроизводится через прокси (файл загружен целиком).';};
document.addEventListener('keydown',function(e){var k=e.keyCode,i=n.indexOf(document.activeElement);if(k===38||k===40||((k===37||k===39)&&i!==0&&i!==2)){e.preventDefault();n[(Math.max(0,i)+(k===38||k===37?n.length-1:1))%n.length].focus();}});n[11].onclick=function(){var seq=++active,thumb=document.getElementById('thumb'),lines=[],assets=[],i=0;v.pause();v.style.display='none';thumb.style.display='none';r.style.maxHeight='420px';r.textContent='Получаем страницу YouTube TV…';
function show(t){lines.push(t);r.textContent=lines.join('\n');}
function get(path,extra,cb){var x=new XMLHttpRequest();x.open('GET',addr(path)+'&ua='+encodeURIComponent(navigator.userAgent)+(extra||''),true);x.timeout=35000;x.onload=function(){if(seq!==active)return;try{cb(JSON.parse(x.responseText));}catch(e){cb({error:'Invalid response'});}};x.onerror=x.ontimeout=function(){if(seq===active)cb({error:'Network / timeout'});};x.send();}
function next(){if(seq!==active)return;if(i>=assets.length){get('/ytthumb','',function(d){if(d.image){thumb.src=d.image;thumb.style.display='inline-block';show('Превью: HTTP '+d.status+' / '+d.bytes+' байт');}else show('Превью: '+(d.error||'нет ответа'));show('Проверка завершена. Это диагностика, не запуск YouTube.');});return;}var a=assets[i++];get('/ytasset','&asset='+encodeURIComponent(a),function(d){show('Ресурс '+i+'/'+assets.length+' '+a.split('?')[0].split('/').pop()+' '+(d.error?'Ошибка: '+d.error:'HTTP '+d.status+' / '+d.bytes+' байт'));next();});}
get('/ytpage','',function(d){if(d.error){show('Страница: '+d.error);return;}show(d.page+' / HTTP '+d.status+' / '+d.bytes+' байт');show('Маркеры: '+(d.markers||[]).join(', '));show('Текст: '+(d.sample||'—'));assets=(d.assets||[]).slice(0,4);show('Найдено ресурсов: '+(d.assets||[]).length+'; проверяем '+assets.length);next();});};
n[11].focus();})();
</script></body></html>
